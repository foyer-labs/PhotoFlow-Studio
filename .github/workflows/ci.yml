# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: No images or RAW in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every tracked file (catches commits made with --no-verify)
        run: sh scripts/check-images.sh --all

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: hygiene
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Build-time downloads (exiftool) and public CC0 RAW samples, cached between runs.
      PHOTOFLOW_SAMPLES: ${{ github.workspace }}/.ci-cache/samples
      ExifToolCacheRoot: ${{ github.workspace }}/.ci-cache/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache downloads (exiftool, public samples)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache
          key: downloads-${{ runner.os }}-${{ hashFiles('build/ExifTool.targets', 'tests/data/public/samples.json') }}
      - name: Restore
        run: dotnet restore PhotoFlow.slnx
      - name: Build (warnings as errors)
        run: dotnet build PhotoFlow.slnx --configuration Release --no-restore
      - name: Test (Unit, Integration, Scenario)
        # Local categories (Parity, Quality, Performance) skip themselves: PHOTOFLOW_TESTDATA is not set here.
        run: >
          dotnet test PhotoFlow.slnx --configuration Release --no-build
          --filter "Category=Unit|Category=Integration|Category=Scenario"
          --logger "trx;LogFileName=results.trx"
