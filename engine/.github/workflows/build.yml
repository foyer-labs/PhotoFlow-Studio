name: Test e build Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      versione:
        description: "Per pubblicare una release: numero di versione (es. 0.9.0), uguale a quello del codice. Vuoto = solo build."
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Installa ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q libimage-exiftool-perl
      - name: Test
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,build]"
      - name: Crea l'eseguibile
        run: pyinstaller packaging/denoiser.spec --noconfirm
      - name: Includi ExifTool (copia completa dei metadati)
        # Se il download non riesce l'app funziona comunque, copiando solo i metadati essenziali.
        continue-on-error: true
        shell: pwsh
        run: |
          # Nome e indirizzo del pacchetto Windows si ricavano dal link nella pagina principale.
          $home_page = (Invoke-WebRequest https://exiftool.org/ -UseBasicParsing).Content
          $zip = [regex]::Match($home_page, 'exiftool-[0-9.]+_64\.zip').Value
          if (-not $zip) { throw "Link al pacchetto Windows di ExifTool non trovato" }
          $href = [regex]::Match($home_page, 'href="([^"]*' + [regex]::Escape($zip) + '[^"]*)"').Groups[1].Value
          $urls = @()
          if ($href) { $urls += ([Uri]::new([Uri]"https://exiftool.org/", $href)).AbsoluteUri }
          $urls += "https://exiftool.org/$zip"
          $urls += "https://sourceforge.net/projects/exiftool/files/$zip/download"
          $ok = $false
          foreach ($u in $urls) {
            Write-Host "Download: $u"
            try { Invoke-WebRequest $u -OutFile $zip -UseBasicParsing -UserAgent "curl/8"; $ok = $true; break } catch { Write-Host "  non riuscito: $($_.Exception.Message)" }
          }
          if (-not $ok) { throw "Download di ExifTool non riuscito" }
          $sums = (Invoke-WebRequest https://exiftool.org/checksums.txt -UseBasicParsing).Content
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sums -notmatch ([regex]::Escape($zip) + "\)\s*=\s*" + $hash)) { throw "Impronta di ExifTool non verificata" }
          Expand-Archive $zip -DestinationPath exiftool_tmp
          $exe = Get-ChildItem exiftool_tmp -Recurse -Filter "exiftool*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force dist\Denoiser\exiftool | Out-Null
          Copy-Item -Recurse "$($exe.DirectoryName)\*" dist\Denoiser\exiftool\
          Rename-Item "dist\Denoiser\exiftool\$($exe.Name)" exiftool.exe
          dist\Denoiser\exiftool\exiftool.exe -ver
      - name: Verifica la riga di comando
        run: dist\Denoiser\denoiser-cli.exe --version
      - name: Verifica RAW, wavelet e NLM nell'eseguibile
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path; from synthetic import clean_linear, write_bayer_dng; write_bayer_dng(Path('prova_raw.dng'), clean_linear(size=256), a=2e-3, b=1e-5)"
          dist\Denoiser\denoiser-cli.exe elabora prova_raw.dng --algoritmo wavelet --formato tiff
          if ($LASTEXITCODE -ne 0) { throw "RAW con wavelet non riuscito" }
          dist\Denoiser\denoiser-cli.exe elabora prova_raw.dng --algoritmo nlm --formato dng --sovrascrivi
          if ($LASTEXITCODE -ne 0) { throw "RAW con NLM e uscita DNG non riuscito" }
          if (-not (Test-Path denoised\prova_raw_dn.tif)) { throw "TIFF mancante" }
          if (-not (Test-Path denoised\prova_raw_dn.dng)) { throw "DNG mancante" }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/modelli
          key: modelli-drunet-479abe3c
      - name: Verifica il modello neurale nell'eseguibile
        shell: pwsh
        env:
          DENOISER_MODELS_DIR: ${{ runner.temp }}/modelli
        run: |
          python -c "import numpy as np; from PIL import Image; rng=np.random.default_rng(0); img=np.clip(np.linspace(0,1,256)[None,:,None]*np.ones((192,256,3))+rng.normal(0,0.08,(192,256,3)),0,1); Image.fromarray((img*255).astype('uint8')).save('prova.png')"
          dist\Denoiser\denoiser-cli.exe modelli scarica drunet
          if ($LASTEXITCODE -ne 0) { throw "download non riuscito" }
          dist\Denoiser\denoiser-cli.exe elabora prova.png --algoritmo drunet --param tile=256 --formato png
          if ($LASTEXITCODE -ne 0) { throw "elaborazione neurale non riuscita" }
          if (-not (Test-Path denoised\prova_dn.png)) { throw "file di uscita mancante" }
      - name: Verifica l'avvio dell'interfaccia
        shell: pwsh
        env:
          DENOISER_SMOKE_TEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\Denoiser\Denoiser.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Denoiser.exe è terminato con codice $($p.ExitCode)" }
      - name: Comprimi
        shell: pwsh
        run: |
          # Licenza, avvisi di terze parti e novità accompagnano sempre l'eseguibile.
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, CHANGELOG.md dist\Denoiser\
          Compress-Archive -Path dist\Denoiser -DestinationPath Denoiser-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Denoiser-windows
          path: Denoiser-windows.zip
          retention-days: 30

  # Pubblicazione di una versione: parte quando si invia un tag «vX.Y.Z», oppure da
  # Actions → «Run workflow» indicando la versione (il tag viene creato qui). Vedi docs/sviluppo.md.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.versione != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Denoiser-windows
      - name: Controlla la versione e prepara le note di rilascio
        id: notes
        run: python3 .github/scripts/note_di_rilascio.py "${{ inputs.versione || github.ref_name }}" note.md
      - name: Rinomina il pacchetto
        run: |
          mv Denoiser-windows*.zip "Denoiser-windows-${{ steps.notes.outputs.version }}.zip"
          sha256sum "Denoiser-windows-${{ steps.notes.outputs.version }}.zip" > "Denoiser-windows-${{ steps.notes.outputs.version }}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Denoiser ${{ steps.notes.outputs.version }}
          body_path: note.md
          # Le versioni 0.x sono anteprime: diventeranno definitive dopo il collaudo sulle foto reali.
          prerelease: ${{ contains(steps.notes.outputs.tag, '-') }}
          files: |
            Denoiser-windows-${{ steps.notes.outputs.version }}.zip
            Denoiser-windows-${{ steps.notes.outputs.version }}.zip.sha256
