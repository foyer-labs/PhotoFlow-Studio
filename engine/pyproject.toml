[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denoiser"
version = "0.14.0"
description = "Riduzione del rumore per foto RAW, JPG e PNG, interamente in locale"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "foyer-labs"}]
requires-python = ">=3.11"
keywords = ["denoise", "riduzione del rumore", "raw", "dng", "nef", "fotografia", "wavelet", "drunet", "scunet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Italian",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "rawpy>=0.21",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "PyWavelets>=1.5",
    "tifffile>=2024.1.0",
    "Pillow>=10.0",
    "onnx>=1.15",
    "onnxruntime>=1.17; sys_platform != 'win32'",
    # Su Windows DirectML usa qualsiasi GPU (NVIDIA, AMD, Intel) senza installare CUDA.
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/foyer-labs/Image-Denoiser"
Documentation = "https://github.com/foyer-labs/Image-Denoiser/blob/HEAD/docs/guida.md"
Changelog = "https://github.com/foyer-labs/Image-Denoiser/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/foyer-labs/Image-Denoiser/issues"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.5"]

[project.scripts]
denoiser = "denoiser.cli:main"

[project.gui-scripts]
denoiser-gui = "denoiser.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
